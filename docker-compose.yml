version: '3.8'

services:
  ai-attendance:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ai_attendance_v2
    ports:
      - "8000:8000"
    environment:
      # These must be provided either in a .env file or injected by your host
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
    restart: unless-stopped
    # If using local GPU for OpenCV/DeepFace (optional, requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
